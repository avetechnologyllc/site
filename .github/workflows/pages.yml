name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the one
# in progress and the latest queued.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASEURL: "/site"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Build
        env:
          JEKYLL_ENV: production
        # BASEURL must match where the site is served from:
        #   "/site"  -> https://avetechnologyllc.github.io/site/
        #   ""       -> once the custom domain avetechnology.xyz is live
        run: bundle exec jekyll build --baseurl "$BASEURL"

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
